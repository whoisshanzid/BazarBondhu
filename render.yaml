services:
  - type: web
    name: bazarbondhu
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w frontend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA_BASE64
        sync: false
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
